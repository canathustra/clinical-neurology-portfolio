<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elektrodiagnostik Kriterler — Kriter Hesaplayıcı</title>
<style>
:root{
  --bg:#eef1f4;--panel:#ffffff;--panel-head:#e7edf3;
  --line:#d7dee5;--line2:#c3ceda;
  --ink:#16232c;--muted:#5c6b78;--dim:#8a97a3;
  --cyan:#0f7a95;--blue:#2f6fbd;--amber:#c97a2a;--green:#2f7d52;--red:#b43b47;
}
*{box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;background:#ccd4da;color:var(--ink);font-family:"Segoe UI",Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;}
body{display:grid;place-items:center;padding:14px;}
.app{width:min(100vw - 28px,1500px);aspect-ratio:16/9;max-height:calc(100vh - 28px);background:var(--bg);border:1px solid #c7d0d8;border-radius:6px;box-shadow:0 24px 60px rgba(20,33,43,.25);display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden;}

.titlebar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 18px;background:linear-gradient(180deg,#ffffff,#eef1f4);border-bottom:1px solid var(--line);font-size:16px;color:#45525c;}
.tb-left{display:flex;align-items:center;gap:10px;font-weight:600;}
.tb-left .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(47,125,82,.5);}
.tb-right{display:flex;align-items:center;gap:18px;font-weight:800;letter-spacing:.12em;color:#7c8894;font-size:15px;}
.tb-right b{color:var(--cyan);}

.toolbar{flex:none;display:flex;align-items:center;gap:28px;padding:12px 18px;background:var(--panel-head);border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tf{display:flex;align-items:baseline;gap:9px;}
.tf label{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
.tf strong{font-size:21px;color:var(--amber);font-weight:800;font-variant-numeric:tabular-nums;}

.workspace{min-height:0;padding:12px;display:grid;grid-template-columns:1fr 300px;gap:12px;}
.panel{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
.panel-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--panel-head);border-bottom:1px solid var(--line);font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#4a5964;}
.badge{display:inline-flex;align-items:center;min-height:22px;padding:2px 10px;border-radius:999px;background:#e6f7ec;color:var(--green);border:1px solid #c8e8d3;font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;}
.badge.on{background:#fbe9ea;color:var(--red);border-color:#f0c7c9;}

.stage-wrap{flex:1;min-height:0;position:relative;background:#fcfdfe;}
#sceneCanvas{display:block;width:100%;height:100%;}

.side{display:flex;flex-direction:column;}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:16px;display:grid;gap:12px;align-content:start;}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:#f3f6f8;border:1px solid var(--line);font-size:15px;}
.stat-row span{color:var(--muted);font-weight:700;}
.stat-row b{color:var(--ink);font-size:15.5px;}
.note-box{padding:13px 14px;background:#f3f6f8;border:1px solid var(--line);font-size:14px;line-height:1.5;color:var(--ink);font-weight:600;}
.note-box b{color:var(--cyan);}

footer{flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel-head);flex-wrap:wrap;}
.modetoggle{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;}
.mbtn{appearance:none;border:none;background:#fff;color:var(--ink);padding:9px 14px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;}
.mbtn.active{background:var(--cyan);color:#fff;}
button.reset{appearance:none;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:6px;min-height:36px;padding:0 14px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;}
button.reset:hover{border-color:var(--cyan);}

.bottom-bar{flex:none;display:flex;align-items:stretch;gap:1px;background:var(--line);border-top:1px solid var(--line);}
.fkey{flex:1;appearance:none;border:none;background:var(--panel-head);color:var(--ink);padding:13px 10px;font:inherit;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;}
.fkey b{color:var(--cyan);font-size:14px;}
.fkey:hover{background:#dce8f0;}

@media(max-width:980px){
  body{padding:0;}
  .app{width:100vw;min-height:100vh;max-height:none;aspect-ratio:auto;border-radius:0;}
  .workspace{grid-template-columns:1fr;}
  .bottom-bar{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="app">

<div class="titlebar">
<div class="tb-left"><span class="dot"></span> NCS/EMG Eğitim Serisi — Polinöropati</div>
<div class="tb-right"><b>CADWELL</b>SIERRA SUMMIT · EMG/NCS</div>
</div>

<div class="toolbar">
<div class="tf"><label>Konu</label><strong style="font-size:15px;color:var(--ink);">Elektrodiagnostik Kriterler</strong></div>
<div class="tf"><label>Animasyon</label><strong style="font-size:15px;color:var(--ink);">1 / 1 — Kriter Hesaplayıcı</strong></div>
</div>

<div class="workspace">
<div class="panel">
<div class="panel-head"><span>Box 29.5 — kaç kriter karşılanıyor?</span><span class="badge" id="stateBadge">0 / 4</span></div>
<div class="stage-wrap" id="stageWrap"><canvas id="sceneCanvas"></canvas></div>
</div>

<div class="panel side">
<div class="panel-head"><span>Okuma</span></div>
<div class="side-body">
<div class="stat-row"><span>Karşılanan Kriter</span><b id="stat1Out">0 / 4</b></div>
<div class="stat-row"><span>Sonuç</span><b id="stat2Out">--</b></div>
<div class="note-box" id="mechNote">Kriterleri aç/kapat.</div>
</div>
</div>
</div>

<footer>
<div class="modetoggle" id="critToggle">
<button class="mbtn" data-key="dl" type="button">1) DL</button>
<button class="mbtn" data-key="cv" type="button">2) İH (CV)</button>
<button class="mbtn" data-key="late" type="button">3) Geç Yanıt</button>
<button class="mbtn" data-key="block" type="button">4) İletim Bloğu/Disperzi</button>
</div>
<button class="reset" id="resetBtn" type="button">Sıfırla</button>
</footer>

<div class="bottom-bar">
<a class="fkey" href="elektrodiagnostik-kriterler.html">F1<b>Önceki: Elektrodiagnostik Kriterler</b></a>
<a class="fkey" href="../index.html">F2<b>İçindekiler</b></a>
<a class="fkey" href="prognoz.html">F3<b>Sıradaki: Prognoz</b></a>
</div>

</div>

<script>
const stageWrap=document.getElementById("stageWrap");
const canvas=document.getElementById("sceneCanvas");
const ctx=canvas.getContext("2d");
const stateBadge=document.getElementById("stateBadge");
const stat1Out=document.getElementById("stat1Out");
const stat2Out=document.getElementById("stat2Out");
const mechNote=document.getElementById("mechNote");
const critToggle=document.getElementById("critToggle");
const resetBtn=document.getElementById("resetBtn");

let cssW=0, cssH=0, dpr=Math.max(1,window.devicePixelRatio||1);
function resizeCanvas(){
  const r=stageWrap.getBoundingClientRect();
  cssW=Math.max(320,Math.round(r.width));
  cssH=Math.max(240,Math.round(r.height));
  canvas.width=Math.round(cssW*dpr);
  canvas.height=Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(()=>{resizeCanvas();draw();}).observe(stageWrap);
resizeCanvas();

const CRITERIA=[
  {key:"dl", num:"1", label:"Distal Motor Latans", detail:"≥2 sinirde >%110 ULN; BKAP düşükse >%120 ULN", color:"#2f6fbd"},
  {key:"cv", num:"2", label:"İletim Hızı", detail:"≥2 sinirde <%90 LLN; BKAP düşükse <%85 LLN", color:"#c97a2a"},
  {key:"late", num:"3", label:"F Minimal Latansı", detail:"≥2 sinirde >%120 ULN", color:"#0f7a95"},
  {key:"block", num:"4", label:"Blok / Temporal Dispersiyon", detail:"≥1 sinirde belirgin iletim bloğu veya temporal dispersiyon", color:"#b43b47"}
];
let active={dl:false, cv:false, late:false, block:false};

function countActive(){ return CRITERIA.reduce(function(n,c){ return n+(active[c.key]?1:0); },0); }

function updateStatics(){
  const n=countActive();
  const pass=n>=3;
  stateBadge.textContent=n+" / 4";
  stateBadge.classList.toggle("on",!pass);
  stat1Out.textContent=n+" / 4";
  stat2Out.textContent=pass? "Karşılandı (≥3)" : "Karşılanmadı (<3)";
  const missing=CRITERIA.filter(function(c){ return !active[c.key]; }).map(function(c){ return c.num+") "+c.label; });
  if(n===0){
    mechNote.innerHTML="Hiçbir kriter aktif değil. Motor sinirlerde bu <b>4 kriterden en az 3'ü</b> gösterilmeli.";
  } else if(pass){
    mechNote.innerHTML="<b>Akut demiyelinizan polinöropati kriterleri karşılandı.</b>"+(missing.length? " Eksik: "+missing.join(", ")+".":" Tüm kriterler karşılanıyor.");
  } else {
    mechNote.innerHTML="<b>Henüz yetersiz.</b> Eksik: "+missing.join(", ")+". Teknik kaliteyi doğrulayın ve klinik şüphe sürüyorsa seri inceleme planlayın.";
  }
  Array.from(critToggle.querySelectorAll(".mbtn")).forEach(function(b){
    b.classList.toggle("active", !!active[b.dataset.key]);
  });
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(){
  const W=cssW,H=cssH;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#fcfdfe"; ctx.fillRect(0,0,W,H);

  const n=CRITERIA.length;
  const padX=W*0.06, gap=W*0.025;
  const boxW=(W-2*padX-gap*(n-1))/n, boxH=H*0.34, boxY=H*0.10;

  ctx.textAlign="center";
  for(let i=0;i<n;i++){
    const c=CRITERIA[i];
    const bx=padX+i*(boxW+gap);
    const isOn=!!active[c.key];
    roundRect(bx,boxY,boxW,boxH,8);
    ctx.fillStyle=isOn? c.color : "#eef1f4";
    ctx.fill();
    if(!isOn){ ctx.lineWidth=1.5; ctx.strokeStyle="#c3ceda"; ctx.stroke(); }
    ctx.fillStyle=isOn? "#ffffff" : "#5c6b78";
    ctx.textBaseline="alphabetic";
    ctx.font="800 "+Math.max(20,boxW*0.16)+"px Inter, sans-serif";
    ctx.fillText(c.num, bx+boxW/2, boxY+boxH*0.42);
    ctx.font="700 "+Math.max(11,boxW*0.075)+"px Inter, sans-serif";
    wrapText(c.label, bx+boxW/2, boxY+boxH*0.65, boxW*0.86, Math.max(13,boxW*0.09));
  }

  const n_active=countActive();
  const pass=n_active>=3;
  const meterY=boxY+boxH+H*0.14, meterH=H*0.10, meterX=padX, meterW=W-2*padX;
  roundRect(meterX,meterY,meterW,meterH,8);
  ctx.fillStyle="#eef1f4"; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle="#c3ceda"; ctx.stroke();
  const fillW=meterW*(n_active/4);
  if(fillW>0){
    roundRect(meterX,meterY,fillW,meterH,8);
    ctx.fillStyle=pass? "#2f7d52" : "#c97a2a";
    ctx.fill();
  }
  const threshX=meterX+meterW*(3/4);
  ctx.strokeStyle="#16232c"; ctx.lineWidth=2; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(threshX,meterY-6); ctx.lineTo(threshX,meterY+meterH+6); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="#16232c"; ctx.font="700 "+Math.max(11,W*0.012)+"px Inter, sans-serif";
  ctx.fillText("eşik: 3/4",threshX,meterY-12);

  ctx.font="800 "+Math.max(26,W*0.03)+"px Inter, sans-serif";
  ctx.fillStyle="#16232c";
  ctx.fillText(n_active+" / 4 kriter",W/2,meterY+meterH+H*0.09);

  ctx.font="800 "+Math.max(15,W*0.017)+"px Inter, sans-serif";
  ctx.fillStyle=pass? "#2f7d52" : "#b43b47";
  ctx.fillText(pass? "KRİTERLER KARŞILANDI" : "KRİTERLER KARŞILANMADI", W/2, meterY+meterH+H*0.16);

  function wrapText(text,cx,startY,maxW,lineH){
    const words=text.split(" ");
    let line="", y=startY, lines=[];
    for(let i=0;i<words.length;i++){
      const test=line? line+" "+words[i] : words[i];
      if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; }
      else line=test;
    }
    lines.push(line);
    lines.forEach(function(l,idx){ ctx.fillText(l,cx,y+idx*lineH); });
  }
}

critToggle.addEventListener("click",function(e){
  const btn=e.target.closest(".mbtn");
  if(!btn) return;
  const k=btn.dataset.key;
  active[k]=!active[k];
  updateStatics();
  draw();
});
resetBtn.addEventListener("click",function(){
  active={dl:false, cv:false, late:false, block:false};
  updateStatics();
  draw();
});

updateStatics();
draw();
</script>
<script src="assets/deck-nav.js"></script>
</body>
</html>
